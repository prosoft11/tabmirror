Description: This stack includes resources needed to deploy AWS CDK apps into this environment
Parameters:
  TrustedAccounts:
    Description: List of AWS accounts that are trusted to publish assets and deploy stacks to this environment
    Default: ''
    Type: CommaDelimitedList
  TrustedAccountsForLookup:
    Description: List of AWS accounts that are trusted to look up values in this environment
    Default: ''
    Type: CommaDelimitedList
  CloudFormationExecutionPolicies:
    Description: List of the ManagedPolicy ARN(s) to attach to the CloudFormation deployment role
    Default: ''
    Type: CommaDelimitedList
  FileAssetsBucketName:
    Description: The name of the S3 bucket used for file assets
    Default: ''
    Type: String
  FileAssetsBucketKmsKeyId:
    Description: Empty to create a new key (default), 'AWS_MANAGED_KEY' to use a managed S3 key, or the ID/ARN of an existing key.
    Default: ''
    Type: String
  ContainerAssetsRepositoryName:
    Description: A user-provided custom name to use for the container assets ECR repository
    Default: ''
    Type: String
  Qualifier:
    Description: An identifier to distinguish multiple bootstrap stacks in the same environment
    Default: hnb659fds
    Type: String
    AllowedPattern: '[A-Za-z0-9_-]{1,10}'
    ConstraintDescription: Qualifier must be an alphanumeric identifier of at most 10 characters
  PublicAccessBlockConfiguration:
    Description: Whether or not to enable S3 Staging Bucket Public Access Block Configuration
    Default: 'true'
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
  InputPermissionsBoundary:
    Description: Whether or not to use either the CDK supplied or custom permissions boundary
    Default: ''
    Type: String
  UseExamplePermissionsBoundary:
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Type: String
  BootstrapVariant:
    Type: String
    Default: 'TabMirror: Foundation Only v1'
    Description: Describe the provenance of the resources in this bootstrap stack. Change this when you customize the template. To prevent accidents, the CDK CLI will not overwrite bootstrap stacks with a different variant.
  DenyExternalId:
    Type: String
    Default: 'true'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Whether to deny AssumeRole calls with an ExternalId. This prevents calls that are intended to be deputized from accidentally assuming CDK Roles.
Conditions:
  HasTrustedAccounts:
    Fn::Not:
      - Fn::Equals:
          - ''
          - Fn::Join:
              - ''
              - Ref: TrustedAccounts
  HasTrustedAccountsForLookup:
    Fn::Not:
      - Fn::Equals:
          - ''
          - Fn::Join:
              - ''
              - Ref: TrustedAccountsForLookup
  HasCloudFormationExecutionPolicies:
    Fn::Not:
      - Fn::Equals:
          - ''
          - Fn::Join:
              - ''
              - Ref: CloudFormationExecutionPolicies
  HasCustomFileAssetsBucketName:
    Fn::Not:
      - Fn::Equals:
          - ''
          - Ref: FileAssetsBucketName
  CreateNewKey:
    Fn::Equals:
      - ''
      - Ref: FileAssetsBucketKmsKeyId
  UseAwsManagedKey:
    Fn::Equals:
      - AWS_MANAGED_KEY
      - Ref: FileAssetsBucketKmsKeyId
  ShouldCreatePermissionsBoundary:
    Fn::Equals:
      - 'true'
      - Ref: UseExamplePermissionsBoundary
  PermissionsBoundarySet:
    Fn::Not:
      - Fn::Equals:
          - ''
          - Ref: InputPermissionsBoundary
  HasCustomContainerAssetsRepositoryName:
    Fn::Not:
      - Fn::Equals:
          - ''
          - Ref: ContainerAssetsRepositoryName
  UsePublicAccessBlockConfiguration:
    Fn::Equals:
      - 'true'
      - Ref: PublicAccessBlockConfiguration
  ShouldDenyExternalId:
    Fn::Equals:
      - 'true'
      - Ref: DenyExternalId
Resources:
  FileAssetsBucketEncryptionKey:
    Type: AWS::KMS::Key
    Properties:
      KeyPolicy:
        Statement:
          - Action:
              - kms:Create*
              - kms:Describe*
              - kms:Enable*
              - kms:List*
              - kms:Put*
              - kms:Update*
              - kms:Revoke*
              - kms:Disable*
              - kms:Get*
              - kms:Delete*
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
              - kms:GenerateDataKey
              - kms:TagResource
              - kms:UntagResource
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
            Resource: '*'
          - Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
            Effect: Allow
            Principal:
              AWS: '*'
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount:
                  Ref: AWS::AccountId
                kms:ViaService:
                  - Fn::Sub: s3.${AWS::Region}.amazonaws.com
          - Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: ${FilePublishingRole.Arn}
            Resource: '*'
    Condition: CreateNewKey
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
  FileAssetsBucketEncryptionKeyAlias:
    Condition: CreateNewKey
    Type: AWS::KMS::Alias
    Properties:
      AliasName:
        Fn::Sub: alias/cdk-${Qualifier}-assets-key
      TargetKeyId:
        Ref: FileAssetsBucketEncryptionKey
  StagingBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Fn::If:
          - HasCustomFileAssetsBucketName
          - Fn::Sub: ${FileAssetsBucketName}
          - Fn::Sub: cdk-${Qualifier}-assets-${AWS::AccountId}-${AWS::Region}
      AccessControl: Private
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID:
                Fn::If:
                  - CreateNewKey
                  - Fn::Sub: ${FileAssetsBucketEncryptionKey.Arn}
                  - Fn::If:
                      - UseAwsManagedKey
                      - Ref: AWS::NoValue
                      - Fn::Sub: ${FileAssetsBucketKmsKeyId}
      PublicAccessBlockConfiguration:
        Fn::If:
          - UsePublicAccessBlockConfiguration
          - BlockPublicAcls: true
            BlockPublicPolicy: true
            IgnorePublicAcls: true
            RestrictPublicBuckets: true
          - Ref: AWS::NoValue
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: CleanupOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
  StagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: StagingBucket
      PolicyDocument:
        Id: AccessControl
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSSLRequestsOnly
            Action: s3:*
            Effect: Deny
            Resource:
              - Fn::Sub: ${StagingBucket.Arn}
              - Fn::Sub: ${StagingBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
            Principal: '*'
  ContainerAssetsRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageTagMutability: IMMUTABLE
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Untagged images should not exist, but expire any older than one year",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 365
                },
                "action": { "type": "expire" }
              }
            ]
          }
      RepositoryName:
        Fn::If:
          - HasCustomContainerAssetsRepositoryName
          - Fn::Sub: ${ContainerAssetsRepositoryName}
          - Fn::Sub: cdk-${Qualifier}-container-assets-${AWS::AccountId}-${AWS::Region}
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Sid: LambdaECRImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringLike:
                aws:sourceArn:
                  Fn::Sub: arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*
          - Sid: EmrServerlessImageRetrievalPolicy
            Effect: Allow
            Principal:
              Service: emr-serverless.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
              - ecr:DescribeImages
            Condition:
              StringLike:
                aws:sourceArn:
                  Fn::Sub: arn:${AWS::Partition}:emr-serverless:${AWS::Region}:${AWS::AccountId}:/applications/*
  FilePublishingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
            Condition:
              Fn::If:
                - ShouldDenyExternalId
                - 'Null':
                    sts:ExternalId: 'true'
                - Ref: AWS::NoValue
          - Action: sts:TagSession
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
                Condition:
                  Fn::If:
                    - ShouldDenyExternalId
                    - 'Null':
                        sts:ExternalId: 'true'
                    - Ref: AWS::NoValue
              - Ref: AWS::NoValue
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:TagSession
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
              - Ref: AWS::NoValue
      RoleName:
        Fn::Sub: cdk-${Qualifier}-file-publishing-role-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: file-publishing
  ImagePublishingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
            Condition:
              Fn::If:
                - ShouldDenyExternalId
                - 'Null':
                    sts:ExternalId: 'true'
                - Ref: AWS::NoValue
          - Action: sts:TagSession
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
                Condition:
                  Fn::If:
                    - ShouldDenyExternalId
                    - 'Null':
                        sts:ExternalId: 'true'
                    - Ref: AWS::NoValue
              - Ref: AWS::NoValue
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:TagSession
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
              - Ref: AWS::NoValue
      RoleName:
        Fn::Sub: cdk-${Qualifier}-image-publishing-role-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: image-publishing
  LookupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
            Condition:
              Fn::If:
                - ShouldDenyExternalId
                - 'Null':
                    sts:ExternalId: 'true'
                - Ref: AWS::NoValue
          - Action: sts:TagSession
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
          - Fn::If:
              - HasTrustedAccountsForLookup
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccountsForLookup
                Condition:
                  Fn::If:
                    - ShouldDenyExternalId
                    - 'Null':
                        sts:ExternalId: 'true'
                    - Ref: AWS::NoValue
              - Ref: AWS::NoValue
          - Fn::If:
              - HasTrustedAccountsForLookup
              - Action:
                  - sts:TagSession
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccountsForLookup
              - Ref: AWS::NoValue
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
                Condition:
                  Fn::If:
                    - ShouldDenyExternalId
                    - 'Null':
                        sts:ExternalId: 'true'
                    - Ref: AWS::NoValue
              - Ref: AWS::NoValue
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:TagSession
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
              - Ref: AWS::NoValue
      RoleName:
        Fn::Sub: cdk-${Qualifier}-lookup-role-${AWS::AccountId}-${AWS::Region}
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/ReadOnlyAccess
      Policies:
        - PolicyDocument:
            Statement:
              - Sid: DontReadSecrets
                Effect: Deny
                Action:
                  - kms:Decrypt
                Resource: '*'
            Version: '2012-10-17'
          PolicyName: LookupRolePolicy
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: lookup
  FilePublishingRoleDefaultPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - s3:GetObject*
              - s3:GetBucket*
              - s3:GetEncryptionConfiguration
              - s3:List*
              - s3:DeleteObject*
              - s3:PutObject*
              - s3:Abort*
            Resource:
              - Fn::Sub: ${StagingBucket.Arn}
              - Fn::Sub: ${StagingBucket.Arn}/*
            Condition:
              StringEquals:
                aws:ResourceAccount:
                  - Fn::Sub: ${AWS::AccountId}
            Effect: Allow
          - Action:
              - kms:Decrypt
              - kms:DescribeKey
              - kms:Encrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
            Effect: Allow
            Resource:
              Fn::If:
                - CreateNewKey
                - Fn::Sub: ${FileAssetsBucketEncryptionKey.Arn}
                - Fn::Sub: arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/${FileAssetsBucketKmsKeyId}
        Version: '2012-10-17'
      Roles:
        - Ref: FilePublishingRole
      PolicyName:
        Fn::Sub: cdk-${Qualifier}-file-publishing-role-default-policy-${AWS::AccountId}-${AWS::Region}
  ImagePublishingRoleDefaultPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - ecr:PutImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:BatchCheckLayerAvailability
              - ecr:DescribeRepositories
              - ecr:DescribeImages
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Resource:
              Fn::Sub: ${ContainerAssetsRepository.Arn}
            Effect: Allow
          - Action:
              - ecr:GetAuthorizationToken
            Resource: '*'
            Effect: Allow
        Version: '2012-10-17'
      Roles:
        - Ref: ImagePublishingRole
      PolicyName:
        Fn::Sub: cdk-${Qualifier}-image-publishing-role-default-policy-${AWS::AccountId}-${AWS::Region}
  DeploymentActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
            Condition:
              Fn::If:
                - ShouldDenyExternalId
                - 'Null':
                    sts:ExternalId: 'true'
                - Ref: AWS::NoValue
          - Action: sts:TagSession
            Effect: Allow
            Principal:
              AWS:
                Ref: AWS::AccountId
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
                Condition:
                  Fn::If:
                    - ShouldDenyExternalId
                    - 'Null':
                        sts:ExternalId: 'true'
                    - Ref: AWS::NoValue
              - Ref: AWS::NoValue
          - Fn::If:
              - HasTrustedAccounts
              - Action:
                  - sts:TagSession
                Effect: Allow
                Principal:
                  AWS:
                    Ref: TrustedAccounts
              - Ref: AWS::NoValue
      Policies:
        - PolicyDocument:
            Statement:
              - Sid: DeployPermissions
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:RollbackStack
                  - cloudformation:ContinueUpdateRollback
                Resource: '*'
              - Sid: PipelineCrossAccountArtifactsBucket
                Effect: Allow
                Action:
                  - s3:GetObject*
                  - s3:GetBucket*
                  - s3:List*
                  - s3:Abort*
                  - s3:DeleteObject*
                  - s3:PutObject*
                Resource: '*'
                Condition:
                  StringNotEquals:
                    s3:ResourceAccount:
                      Ref: AWS::AccountId
              - Sid: PipelineCrossAccountArtifactsKey
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:ReEncrypt*
                  - kms:GenerateDataKey*
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService:
                      Fn::Sub: s3.${AWS::Region}.amazonaws.com
              - Action: iam:PassRole
                Resource:
                  Fn::Sub: ${CloudFormationExecutionRole.Arn}
                Effect: Allow
              - Sid: CliPermissions
                Action:
                  - cloudformation:DeleteStack
                  - cloudformation:UpdateTerminationProtection
                  - sts:GetCallerIdentity
                Resource: '*'
                Effect: Allow
              - Sid: CliStagingBucket
                Effect: Allow
                Action:
                  - s3:GetObject*
                  - s3:GetBucket*
                  - s3:List*
                Resource:
                  - Fn::Sub: ${StagingBucket.Arn}
                  - Fn::Sub: ${StagingBucket.Arn}/*
              - Sid: ReadVersion
                Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CdkBootstrapVersion}
              - Sid: Refactor
                Effect: Allow
                Action:
                  - cloudformation:CreateStackRefactor
                  - cloudformation:ExecuteStackRefactor
                Resource: '*'
            Version: '2012-10-17'
          PolicyName: default
      ManagedPolicyArns:
        - Fn::Sub: arn:${AWS::Partition}:iam::aws:policy/AWSCloudFormationReadOnlyAccess
      RoleName:
        Fn::Sub: cdk-${Qualifier}-deploy-role-${AWS::AccountId}-${AWS::Region}
      Tags:
        - Key: aws-cdk:bootstrap-role
          Value: deploy
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
        Version: '2012-10-17'
      Policies:
        [
          {
            'PolicyName': 'TabMirrorFoundationOnly',
            'PolicyDocument':
              {
                'Version': '2012-10-17',
                'Statement':
                  [
                    {
                      'Effect': 'Allow',
                      'Action': ['ssm:GetParameters'],
                      'Resource':
                        [
                          'arn:aws:ssm:us-west-2:400745793130:parameter/cdk-bootstrap/hnb659fds/version',
                          'arn:aws:ssm:us-east-1:400745793130:parameter/cdk-bootstrap/hnb659fds/version',
                        ],
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          's3:CreateBucket',
                          's3:DeleteBucket',
                          's3:GetBucket*',
                          's3:ListBucket',
                          's3:PutBucket*',
                          's3:PutEncryptionConfiguration',
                          's3:GetEncryptionConfiguration',
                          's3:GetAccelerateConfiguration',
                          's3:GetLifecycleConfiguration',
                          's3:GetAnalyticsConfiguration',
                          's3:GetInventoryConfiguration',
                          's3:GetMetricsConfiguration',
                          's3:GetReplicationConfiguration',
                          's3:GetIntelligentTieringConfiguration',
                          's3:ListTagsForResource',
                          's3:TagResource',
                          's3:UntagResource',
                          's3:DeleteBucketPolicy',
                        ],
                      'Resource': ['arn:aws:s3:::tabmirrordata-*'],
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'dynamodb:CreateTable',
                          'dynamodb:DescribeTable',
                          'dynamodb:UpdateTable',
                          'dynamodb:DeleteTable',
                          'dynamodb:DescribeContinuousBackups',
                          'dynamodb:UpdateContinuousBackups',
                          'dynamodb:DescribeTimeToLive',
                          'dynamodb:UpdateTimeToLive',
                          'dynamodb:TagResource',
                          'dynamodb:UntagResource',
                          'dynamodb:ListTagsOfResource',
                        ],
                      'Resource':
                        [
                          'arn:aws:dynamodb:us-west-2:400745793130:table/TabMirrorData-*',
                        ],
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'secretsmanager:CreateSecret',
                          'secretsmanager:DescribeSecret',
                          'secretsmanager:TagResource',
                          'secretsmanager:UntagResource',
                          'secretsmanager:UpdateSecret',
                          'secretsmanager:DeleteSecret',
                          'secretsmanager:GetResourcePolicy',
                          'secretsmanager:PutResourcePolicy',
                        ],
                      'Resource':
                        [
                          'arn:aws:secretsmanager:us-west-2:400745793130:secret:tabmirror/production/google-oauth-*',
                        ],
                    },
                    {
                      'Effect': 'Allow',
                      'Action': ['acm:RequestCertificate'],
                      'Resource': '*',
                      'Condition':
                        {
                          'StringEquals':
                            { 'aws:RequestedRegion': 'us-east-1' },
                          'ForAllValues:StringEquals':
                            { 'acm:DomainNames': ['tabs.portuit.com'] },
                          'Null': { 'acm:DomainNames': 'false' },
                        },
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'acm:DescribeCertificate',
                          'acm:AddTagsToCertificate',
                          'acm:RemoveTagsFromCertificate',
                          'acm:ListTagsForCertificate',
                          'acm:DeleteCertificate',
                        ],
                      'Resource':
                        ['arn:aws:acm:us-east-1:400745793130:certificate/*'],
                    },
                  ],
              },
          },
          {
            'PolicyName': 'TabMirrorApplicationDeployment',
            'PolicyDocument':
              {
                'Version': '2012-10-17',
                'Statement':
                  [
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'cloudfront:CreateDistribution',
                          'cloudfront:CreateFunction',
                          'cloudfront:CreateOriginAccessControl',
                          'cloudfront:CreateResponseHeadersPolicy',
                        ],
                      'Resource': '*',
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'cloudfront:TagResource',
                          'cloudfront:UntagResource',
                          'cloudfront:ListTagsForResource',
                        ],
                      'Resource': 'arn:aws:cloudfront::400745793130:function/us-west-2TabMirrorApplication*',
                    },
                    {
                      'Effect': 'Allow',
                      'Action': ['ssm:GetParameters'],
                      'Resource': 'arn:aws:ssm:us-west-2:400745793130:parameter/cdk-bootstrap/hnb659fds/version',
                    },
                    {
                      'Effect': 'Allow',
                      'Action': ['s3:GetObject', 's3:GetObjectVersion'],
                      'Resource': 'arn:aws:s3:::cdk-hnb659fds-assets-400745793130-us-west-2/*',
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          's3:GetBucketPolicy',
                          's3:PutBucketPolicy',
                          's3:DeleteBucketPolicy',
                        ],
                      'Resource': 'arn:aws:s3:::tabmirrordata-webassets27872646-odbdb9wigark',
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'secretsmanager:GetSecretValue',
                          'secretsmanager:DescribeSecret',
                        ],
                      'Resource': 'arn:aws:secretsmanager:us-west-2:400745793130:secret:tabmirror/production/google-oauth-KCeRHP',
                    },
                    {
                      'Effect': 'Allow',
                      'Action':
                        [
                          'iam:CreateRole',
                          'iam:DeleteRole',
                          'iam:GetRole',
                          'iam:TagRole',
                          'iam:UntagRole',
                          'iam:ListRoleTags',
                          'iam:UpdateAssumeRolePolicy',
                          'iam:PutRolePolicy',
                          'iam:GetRolePolicy',
                          'iam:DeleteRolePolicy',
                          'iam:ListRolePolicies',
                          'iam:ListAttachedRolePolicies',
                        ],
                      'Resource': 'arn:aws:iam::400745793130:role/TabMirrorApplication-*',
                    },
                    {
                      'Effect': 'Allow',
